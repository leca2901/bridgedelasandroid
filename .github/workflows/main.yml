name: Gerar APK
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Abrir o projeto.zip
        run: unzip -o projeto.zip -d projeto
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Ajustar checagens
        working-directory: projeto
        run: |
          echo 'android { lint { checkReleaseBuilds = false; abortOnError = false } }' >> app/build.gradle.kts
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Compilar
        working-directory: projeto
        run: gradle assembleRelease --no-daemon
      - name: Renomear
        run: cp projeto/app/build/outputs/apk/release/app-release.apk RedeDelas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RedeDelas-apk
          path: RedeDelas.apk
